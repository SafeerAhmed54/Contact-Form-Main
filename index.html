<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Contact form</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<section class="contact-form">
  <div class="container">
    <div class="row">
      <div class="col">
        <form action="" class="form">
          <h2>Contact Us</h2>
          <div class="first-row">
            <div class="input-50">
              <label class="label" for="first-name">First Name *</label>
              <input class="input" type="text" id="first-name" name="first-name" placeholder="Enter your first name" required >
              <span class="error-message">This field is required</span>
            </div>
            <div class="input-50">
              <label class="label" for="last-name">Last Name *</label>
              <input class="input" type="text" id="last-name" name="last-name" placeholder="Enter your last name" required>
              <span class="error-message">This field is required</span>
            </div>
          </div>
          <div class="second-row">
            <div class="input-100">
              <label class="label" for="email">Email Address *</label>
              <input class="input" type="email" id="email" name="email" placeholder="Enter your email address" required>
              <span class="error-message">Please enter a valid email address</span>
            </div>
          </div>
          <div class="third-row">
            <div class="input-50">
              <label class="label" for="first-name">First Name *</label>
              <input class="input" type="text" id="first-name" name="first-name" placeholder="Enter your first name" required >
              <span class="error-message">This field is required</span>
            </div>
            <div class="input-50">
              <label class="label" for="last-name">Last Name *</label>
              <input class="input" type="text" id="last-name" name="last-name" placeholder="Enter your last name" required>
              <span class="error-message">This field is required</span>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
  
</body>
</html>
